<!DOCTYPE html>
<html>
<head>
    <title>Solvia İletişim Platformu</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/wallet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-base@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-phantom@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-solflare@latest/lib/index.iife.min.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>Solvia İletişim Platformu</h1>
            <p>Merkeziyetsiz iletişime başlamak için cüzdanınızı bağlayın</p>
            <div class="wallet-container">
                <button id="connectWalletBtn" class="btn primary">
                    <i class="fas fa-wallet"></i> Cüzdan ile Giriş Yap
                </button>
                <div id="walletStatus" class="wallet-status">Cüzdan bağlantısı bekleniyor...</div>
            </div>
        </div>
    </div>
    
    <div id="mainApp" class="app-container" style="display: none;">
        <!-- Left sidebar for contacts -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div id="userWallet" class="user-wallet"></div>
                <div class="header-icons">
                    <i class="fas fa-sync-alt" id="refreshBtn"></i>
                    <i class="fas fa-plus" id="newChatBtn"></i>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Kişi ara veya yeni sohbet">
                </div>
            </div>
            
            <div class="contacts-list" id="contactsList">
                <!-- Contacts will be added here dynamically -->
            </div>
        </div>

        <!-- Main chat area -->
        <div class="chat-area">
            <div class="chat-header">
                <div id="currentChatTitle">Sohbet</div>
                <div class="chat-header-icons">
                    <i class="fas fa-video" id="startVideoBtn"></i>
                    <i class="fas fa-phone" id="startAudioBtn"></i>
                </div>
            </div>

            <div id="messages" class="messages-container"></div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Mesaj yazın...">
                <button id="sendMessageBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        
        <div class="video-container" id="videoContainer">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">Siz</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Karşı Taraf</div>
            </div>
        </div>

        <div class="controls">
            <button id="startCall" class="btn primary" onclick="startVideoCall()">
                <i class="fas fa-video"></i> Görüntülü Arama Başlat
            </button>
            <button id="endCall" class="btn danger" onclick="endCall()" disabled>
                <i class="fas fa-phone-slash"></i> Aramayı Sonlandır
            </button>
        </div>

        <div class="chat-container">
            <div class="contacts-panel">
                <div class="contacts-header">
                    <h3>Cüzdanlar</h3>
                    <button id="addContactBtn" class="btn secondary">
                        <i class="fas fa-plus"></i> Yeni
                    </button>
                </div>
                <div id="contactsList" class="contacts-list">
                    <!-- Cüzdanlar buraya dinamik olarak eklenecek -->
                </div>
            </div>
            <div class="chat-panel">
                <div class="current-chat-header">
                    <span id="currentChatTitle">Genel Sohbet</span>
                </div>
                <div id="messages" class="messages"></div>
                <div class="message-input">
                    <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." 
                           onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="btn primary">
                        <i class="fas fa-paper-plane"></i> Gönder
                    </button>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="/static/js/bs58.js"></script>
    <script src="/static/js/walletAuth.js"></script>
    <script src="/static/js/webrtc.js"></script>
    <script src="/static/js/contacts.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('connectWalletBtn').addEventListener('click', async () => {
            try {
                const auth = await window.walletAuth.connect();
                document.getElementById('walletStatus').textContent = 
                    `Bağlı Cüzdan: ${auth.publicKey.slice(0, 4)}...${auth.publicKey.slice(-4)}`;
                
                localStorage.setItem('walletAddress', auth.publicKey);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
