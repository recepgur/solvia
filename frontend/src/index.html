<!DOCTYPE html>
<html>
<head>
    <title>Solvia İletişim Platformu</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/wallet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-base@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-phantom@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/wallet-adapter-solflare@latest/lib/index.iife.min.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>Solvia İletişim Platformu</h1>
            <p>Merkeziyetsiz iletişime başlamak için cüzdanınızı bağlayın</p>
            <div class="wallet-container">
                <button id="connectWalletBtn" class="btn primary">
                    <i class="fas fa-wallet"></i> Cüzdan ile Giriş Yap
                </button>
                <div id="walletStatus" class="wallet-status">Cüzdan bağlantısı bekleniyor...</div>
            </div>
        </div>
    </div>
    
    <div id="mainApp" class="app-container" style="display: none;">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Header -->
            <div class="header">
                <h1>Solvia</h1>
                <div class="header-actions">
                    <i class="fas fa-search" id="searchBtn"></i>
                    <i class="fas fa-ellipsis-v" id="menuBtn"></i>
                </div>
            </div>

            <!-- Chat List -->
            <div class="chat-list" id="chatList">
                <!-- Chats will be added here dynamically -->
            </div>

            <!-- Floating Action Button -->
            <div class="fab-button" id="newChatBtn">
                <i class="fas fa-comment"></i>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div class="nav-items">
                    <div class="nav-item active">
                        <i class="fas fa-comment"></i>
                        <span>Sohbetler</span>
                    </div>
                    <div class="nav-item">
                        <i class="fas fa-phone-alt"></i>
                        <span>Aramalar</span>
                    </div>
                    <div class="nav-item">
                        <i class="fas fa-cog"></i>
                        <span>Ayarlar</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Screen (Initially Hidden) -->
        <div class="chat-screen" id="chatScreen" style="display: none;">
            <div class="chat-header">
                <div class="back-button">
                    <i class="fas fa-arrow-left" id="backToChats"></i>
                </div>
                <div class="chat-contact">
                    <div class="contact-avatar"></div>
                    <div class="contact-info">
                        <div class="contact-name" id="currentChatTitle">Sohbet</div>
                        <div class="contact-status">çevrimiçi</div>
                    </div>
                </div>
                <div class="chat-actions">
                    <i class="fas fa-video" id="startVideoBtn"></i>
                    <i class="fas fa-phone" id="startAudioBtn"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>

            <div class="messages" id="messagesContainer"></div>

            <div class="message-input">
                <div class="input-container">
                    <i class="fas fa-smile"></i>
                    <input type="text" id="messageInput" placeholder="Mesaj yazın...">
                    <i class="fas fa-paperclip"></i>
                    <i class="fas fa-paper-plane" id="sendMessageBtn"></i>
                </div>
            </div>
        </div>
        
        <!-- Video Call Container -->
        <div class="video-container" id="videoContainer">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">Siz</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Karşı Taraf</div>
            </div>
            <div class="video-controls">
                <button id="endCall" class="btn danger" onclick="endCall()">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="/static/js/bs58.js"></script>
    <script src="/static/js/walletAuth.js"></script>
    <script src="/static/js/webrtc.js"></script>
    <script src="/static/js/contacts.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('connectWalletBtn').addEventListener('click', async () => {
            try {
                const auth = await window.walletAuth.connect();
                document.getElementById('walletStatus').textContent = 
                    `Bağlı Cüzdan: ${auth.publicKey.slice(0, 4)}...${auth.publicKey.slice(-4)}`;
                
                localStorage.setItem('walletAddress', auth.publicKey);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
