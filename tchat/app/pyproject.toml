[tool.poetry]
name = "tchat"
version = "0.1.0"
description = "TChat Backend API"
authors = ["Devin <devin@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9.2,<4.0"
fastapi = {extras = ["all"], version = "^0.115.6"}
uvicorn = {extras = ["standard"], version = "^0.34.0"}
websockets = "^10.4"
python-jose = "^3.3.0"
pyjwt = "^2.10.1"
cryptography = "^44.0.0"
aiohttp = "^3.9.3"
solana = {extras = ["full"], version = "^0.30.2"}
base58 = "^2.1.1"
aioipfs = "^0.6.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
