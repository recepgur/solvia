[tool.poetry]
name = "tchat-backend"
version = "0.1.0"
description = "TChat Backend API - Decentralized messaging platform built on Solana blockchain"
authors = ["Devin <devin@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9.2,<4.0"
fastapi = {extras = ["all"], version = "^0.115.6"}
uvicorn = {extras = ["standard"], version = "^0.34.0"}
websockets = "^11.0"
python-jose = "^3.3.0"
pyjwt = "^2.10.1"
cryptography = "^44.0.0"
aiohttp = "^3.9.3"
aioipfs = "^0.6.3"
solana = "^0.30.2"
base58 = "^2.1.1"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"
pydantic = {extras = ["email"], version = "^2.6.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
