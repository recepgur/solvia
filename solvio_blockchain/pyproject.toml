[tool.poetry]
name = "solvio-blockchain"
version = "0.1.0"
description = "A specialized blockchain network optimized for decentralized communication"
authors = ["Solvio Team"]
readme = "README.md"
packages = [
    { include = "solvio" }
]

[tool.poetry.dependencies]
python = "^3.12"
asyncio = "^3.4.3"
uvloop = "^0.21.0"
pynacl = "^1.5.0"
aiohttp = "^3.11.11"
protobuf = "^5.29.3"
grpcio = "^1.69.0"
cryptography = "^44.0.0"
base58 = "^2.1.1"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^4.1.0"
aioquic = "^1.2.0"
kademlia = "^2.2.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
