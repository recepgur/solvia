app = "app-hbycamzu"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  FRONTEND_PATH = "/app/dist"
  PORT = "8080"
  PYTHONPATH = "/app/backend"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[deploy]
  strategy = "immediate"
